name: Cron Every 5 Minutes

on:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  cron-job:
    runs-on: ubuntu-latest

    steps:
      - name: Start Message
        run: echo "Cron Job Started!"

      - name: Display Date
        run: date

      - name: Display Time
        run: date +"%H:%M:%S"

      - name: Completion Message
        run: echo "Cron Job Completed Successfully!"
